name: Build Kext

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files (Debug)
        run: |
          echo "=== 根目录文件列表 ==="
          ls -la

      - name: Build with xcodebuild
        run: |
          # 寻找根目录及子目录下的 .xcodeproj 文件
          PROJ=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          
          if [ -n "$PROJ" ]; then
            echo "找到 Xcode 工程: $PROJ"
            xcodebuild -project "$PROJ" -configuration Release build
          else
            echo "未找到 .xcodeproj 文件，尝试常规 make 编译..."
            make || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RTL8821CEwifi-kext
          path: |
            build/Release/*.kext
            **/*.kext
