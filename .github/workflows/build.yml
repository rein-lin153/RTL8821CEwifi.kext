name: Build Kext

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect File Structure
        run: |
          echo "=== 根目录完整文件结构 ==="
          ls -la
          echo "=== 所有xcodeproj/Makefile/CMakeLists位置 ==="
          find . -maxdepth 3 -name "*.xcodeproj" -o -name "Makefile" -o -name "CMakeLists.txt"

      - name: Attempt Build
        run: |
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          MAKE=$(find . -maxdepth 3 -name "Makefile" | head -n 1)
          CMAKE=$(find . -maxdepth 3 -name "CMakeLists.txt" | head -n 1)

          if [ -n "$PROJ" ]; then
            echo "发现 Xcode 项目: $PROJ"
            xcodebuild -project "$PROJ" -configuration Release -derivedDataPath buildClean build
          elif [ -n "$MAKE" ]; then
            echo "发现 Makefile，尝试 make 编译..."
            cd $(dirname "$MAKE")
            make
          elif [ -n "$CMAKE" ]; then
            echo "发现 CMake 项目，开始构建..."
            mkdir -p build && cd build
            cmake ..
            make
          else
            echo "警告：未找到标准构建配置文件！"
            exit 1
          fi

      - name: Locate and Upload Kext
        uses: actions/upload-artifact@v4
        with:
          name: RTL8821CEwifi-kext
          path: |
            **/*.kext
